<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIC 2025 - Event Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: #050508;
            overflow-x: hidden;
            color: #fff;
            min-height: 100vh;
        }

        .viewport {
            width: 100%;
            height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
            cursor: default;
            background: 
                radial-gradient(circle at 20% 50%, rgba(159, 52, 250, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(76, 76, 241, 0.1) 0%, transparent 50%),
                radial-gradient(circle at center, #0a0a14 0%, #050508 100%);
        }

        .canvas {
            position: relative;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 200px 40px 40px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin: 40px 0 60px;
        }

        .image-node {
            position: relative;
            cursor: pointer;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 30px rgba(159, 52, 250, 0.25);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            background: #1a1a2e;
            border: 2px solid rgba(159, 52, 250, 0.2);
            aspect-ratio: 4 / 3;
        }

        .image-node img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .image-node:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 15px 35px rgba(241, 179, 58, 0.4);
            border-color: rgba(241, 179, 58, 0.6);
        }

        .image-node:hover img {
            transform: scale(1.05);
        }

        .image-label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.95), transparent);
            padding: 18px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .image-node:hover .image-label {
            opacity: 1;
            transform: translateY(0);
        }

        .image-label h3 {
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: #F1B33A;
        }

        .image-label p {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 300;
        }

        .empty-state {
            text-align: center;
            color: rgba(255,255,255,0.7);
            font-size: 1rem;
            padding: 4rem 1rem;
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 30px 40px;
            background: linear-gradient(to bottom, 
                rgba(5, 5, 8, 0.95) 0%, 
                rgba(5, 5, 8, 0.7) 50%,
                transparent 100%);
            z-index: 1000;
            pointer-events: auto;
        }

        .header h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #9F34FA 0%, #F1B33A 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.5));
        }

        .header p {
            font-size: 0.85rem;
            color: rgba(241, 179, 58, 0.9);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 400;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
        }
        
        .header .subtitle {
            font-size: 0.75rem;
            color: rgba(159, 52, 250, 0.7);
            letter-spacing: 1px;
            margin-top: 4px;
            font-weight: 300;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
        }

        .gallery-tabs {
            display: inline-flex;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        .tab-btn {
            padding: 0.5rem 1.5rem;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: var(--white);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-size: 0.75rem;
        }

        .tab-btn.active {
            background: var(--purple);
            border-color: var(--purple);
            box-shadow: 0 8px 20px rgba(159, 52, 250, 0.35);
        }

        .tab-btn:hover {
            border-color: rgba(255, 255, 255, 0.5);
        }

        .section-heading {
            position: absolute;
            left: 40px;
            right: 40px;
            font-family: 'Poppins', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: rgba(241, 179, 58, 0.9);
            padding: 0.5rem 1rem;
            border-left: 4px solid var(--purple);
            background: rgba(5, 5, 8, 0.75);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
            border-radius: 0.5rem;
            z-index: 2;
            pointer-events: none;
        }

        /* Lightbox */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            opacity: 0;
            transition: opacity 0.4s ease;
            backdrop-filter: blur(20px);
        }

        .lightbox.active {
            display: flex;
            animation: fadeIn 0.4s ease forwards;
        }

        .lightbox-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            animation: zoomIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .lightbox-content img {
            max-width: 100%;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 20px 80px rgba(159, 52, 250, 0.4);
            border: 3px solid rgba(159, 52, 250, 0.3);
        }

        .lightbox-info {
            position: absolute;
            bottom: -60px;
            left: 0;
            right: 0;
            text-align: center;
        }

        .lightbox-info h2 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            margin-bottom: 6px;
            color: #F1B33A;
        }

        .lightbox-info p {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .lightbox-close {
            position: absolute;
            top: -60px;
            right: 0;
            background: rgba(76, 76, 241, 0.2);
            border: 2px solid rgba(159, 52, 250, 0.4);
            color: white;
            font-size: 32px;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-weight: 300;
            line-height: 1;
        }

        .lightbox-close:hover {
            background: #F1B33A;
            border-color: #F1B33A;
            color: #050508;
            transform: rotate(90deg);
            box-shadow: 0 4px 20px rgba(241, 179, 58, 0.5);
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(76, 76, 241, 0.2);
            border: 2px solid rgba(159, 52, 250, 0.4);
            color: white;
            font-size: 32px;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .lightbox-nav:hover {
            background: #F1B33A;
            border-color: #F1B33A;
            color: #050508;
            transform: translateY(-50%) scale(1.1);
            box-shadow: 0 4px 20px rgba(241, 179, 58, 0.5);
        }

        .lightbox-prev { left: 30px; }
        .lightbox-next { right: 30px; }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes zoomIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (max-width: 1024px) {
            .canvas {
                padding: 180px 24px 32px;
            }
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            }
        }

        @media (max-width: 768px) {
            .canvas {
                padding: 160px 20px 24px;
            }
            .header h1 { font-size: 1.8rem; }
            .lightbox-nav {
                width: 50px;
                height: 50px;
                font-size: 24px;
            }
            .lightbox-prev { left: 15px; }
            .lightbox-next { right: 15px; }
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }
        }

        @media (max-width: 640px) {
            .canvas {
                padding: 140px 16px 20px;
            }
            .gallery-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>MIC 2025 Gallery</h1>
        <p>Sydney • October 31 - November 2</p>
        <div class="subtitle">Scroll to explore • Click any photo to view</div>
        <div class="gallery-tabs" id="galleryTabs">
            <button class="tab-btn active" data-category="All">All</button>
            <button class="tab-btn" data-category="Awards">Awards</button>
            <button class="tab-btn" data-category="MIC Day 1">MIC Day 1</button>
        </div>
    </div>

    <div class="viewport" id="viewport">
        <div class="canvas" id="canvas">
            <!-- Images will be generated by JavaScript -->
        </div>
    </div>

    <div class="lightbox" id="lightbox">
        <div class="lightbox-content">
            <button class="lightbox-close" id="lightboxClose">×</button>
            <button class="lightbox-nav lightbox-prev" id="lightboxPrev">‹</button>
            <img src="" alt="Lightbox image" id="lightboxImg">
            <button class="lightbox-nav lightbox-next" id="lightboxNext">›</button>
            <div class="lightbox-info" id="lightboxInfo">
                <h2 id="lightboxTitle"></h2>
                <p id="lightboxDesc"></p>
            </div>
        </div>
    </div>

        <script>
        let allItems = [];
        let currentCategory = 'All';
        const categoriesOrder = ['Awards', 'MIC Day 1'];
        let visibleOrder = [];

        const basePath = (() => {
            const path = window.location.pathname;
            if (path.endsWith('/')) return path;
            const idx = path.lastIndexOf('/');
            return idx === -1 ? '/' : path.slice(0, idx + 1);
        })();

        function resolveMediaPath(mediaPath) {
            if (!mediaPath) return '';
            if (/^https?:\/\//i.test(mediaPath)) return mediaPath;
            const cleanPath = mediaPath.replace(/^\/+/, '');
            return `${basePath}${cleanPath}`;
        }

        const canvas = document.getElementById('canvas');
        const tabsContainer = document.getElementById('galleryTabs');

        fetch('./gallery/gallery.json')
            .then(r => r.json())
            .then(items => {
                allItems = items.map((item, index) => ({ ...item, _id: index }));
                updateTabsActive();
                createLayout();
            })
            .catch(err => console.error('Failed to load gallery JSON', err));

        tabsContainer?.addEventListener('click', (e) => {
            const button = e.target.closest('.tab-btn');
            if (!button) return;
            const category = button.dataset.category;
            if (!category || category === currentCategory) return;
            currentCategory = category;
            updateTabsActive();
            createLayout();
        });

        function normalizeCategory(value) {
            return (value || '').toLowerCase();
        }

        function resolveCategoryName(value) {
            return value && value.trim() ? value : 'Gallery';
        }

        function updateTabsActive() {
            if (!tabsContainer) return;
            tabsContainer.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.category === currentCategory);
            });
        }

        function getFilteredItems() {
            if (!allItems.length) return [];
            if (!currentCategory || currentCategory === 'All') return allItems;
            const normalized = normalizeCategory(currentCategory);
            const filtered = allItems.filter(item => normalizeCategory(item.category) === normalized);
            return filtered.length ? filtered : allItems;
        }

        function buildGroups(items) {
            const grouped = new Map();
            items.forEach(item => {
                const key = resolveCategoryName(item.category);
                if (!grouped.has(key)) grouped.set(key, []);
                grouped.get(key).push(item);
            });

            if (currentCategory && currentCategory !== 'All') {
                const target = categoriesOrder.find(cat => normalizeCategory(cat) === normalizeCategory(currentCategory)) || currentCategory;
                return grouped.has(target) ? [{ category: target, items: grouped.get(target) }] : [];
            }

            const order = [...categoriesOrder, ...grouped.keys()];
            const seen = new Set();
            const result = [];
            order.forEach(key => {
                if (grouped.has(key) && !seen.has(key)) {
                    result.push({ category: key, items: grouped.get(key) });
                    seen.add(key);
                }
            });
            return result;
        }

        function createLayout() {
            const displayItems = getFilteredItems();
            const fragment = document.createDocumentFragment();
            visibleOrder = [];

            if (!displayItems.length) {
                const empty = document.createElement('p');
                empty.className = 'empty-state';
                empty.textContent = 'No images available yet.';
                fragment.appendChild(empty);
            } else {
                const groups = buildGroups(displayItems);
                groups.forEach(group => {
                    if (!group.items.length) return;

                    const heading = document.createElement('div');
                    heading.className = 'section-heading';
                    heading.textContent = group.category;
                    fragment.appendChild(heading);

                    const grid = document.createElement('div');
                    grid.className = 'gallery-grid';

                    group.items.forEach(item => {
                        const orderIndex = visibleOrder.length;
                        visibleOrder.push(item._id);

                        const node = document.createElement('div');
                        node.className = 'image-node';

                        const img = document.createElement('img');
                        img.src = resolveMediaPath(item.thumb || item.full);
                        img.alt = item.title || 'MIC 2025 Gallery image';

                        const label = document.createElement('div');
                        label.className = 'image-label';
                        label.innerHTML = `
                            <h3>${item.title ? item.title.replace(/_/g, ' ') : 'MIC 2025'}</h3>
                            <p>${resolveCategoryName(item.category)}</p>
                        `;

                        node.appendChild(img);
                        node.appendChild(label);
                        node.addEventListener('click', () => openLightbox(orderIndex));
                        grid.appendChild(node);
                    });

                    fragment.appendChild(grid);
                });
            }

            canvas.innerHTML = '';
            canvas.appendChild(fragment);
        }

        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const lightboxTitle = document.getElementById('lightboxTitle');
        const lightboxDesc = document.getElementById('lightboxDesc');
        const lightboxClose = document.getElementById('lightboxClose');
        const lightboxPrev = document.getElementById('lightboxPrev');
        const lightboxNext = document.getElementById('lightboxNext');

        let currentIndex = 0;

        function openLightbox(orderIndex) {
            if (!visibleOrder.length) return;
            currentIndex = Math.max(0, Math.min(orderIndex, visibleOrder.length - 1));
            const item = allItems[visibleOrder[currentIndex]];
            if (!item) return;
            lightboxImg.src = resolveMediaPath(item.full || item.thumb);
            lightboxTitle.textContent = item.title || '';
            lightboxDesc.textContent = item.desc || '';
            lightbox.classList.add('active');
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
        }

        function showNext() {
            if (!visibleOrder.length) return;
            currentIndex = (currentIndex + 1) % visibleOrder.length;
            const item = allItems[visibleOrder[currentIndex]];
            lightboxImg.src = resolveMediaPath(item.full || item.thumb);
            lightboxTitle.textContent = item.title || '';
            lightboxDesc.textContent = item.desc || '';
        }

        function showPrev() {
            if (!visibleOrder.length) return;
            currentIndex = (currentIndex - 1 + visibleOrder.length) % visibleOrder.length;
            const item = allItems[visibleOrder[currentIndex]];
            lightboxImg.src = resolveMediaPath(item.full || item.thumb);
            lightboxTitle.textContent = item.title || '';
            lightboxDesc.textContent = item.desc || '';
        }

        lightboxClose.addEventListener('click', closeLightbox);
        lightboxNext.addEventListener('click', showNext);
        lightboxPrev.addEventListener('click', showPrev);

        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
        });

        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowRight') showNext();
            if (e.key === 'ArrowLeft') showPrev();
        });
    </script>

</body>
</html>
