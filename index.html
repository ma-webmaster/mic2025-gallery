<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIC 2025 - Event Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: #050508;
            overflow: hidden;
            color: #fff;
            height: 100vh;
        }

        .viewport {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            cursor: grab;
            position: relative;
            background: 
                radial-gradient(circle at 20% 50%, rgba(159, 52, 250, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(76, 76, 241, 0.1) 0%, transparent 50%),
                radial-gradient(circle at center, #0a0a14 0%, #050508 100%);
        }

        .canvas {
            position: absolute;
            transform-origin: 0 0;
            transition: transform 0.3s ease-out;
            will-change: transform;
        }

        .image-node {
            position: absolute;
            cursor: pointer;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(159, 52, 250, 0.3);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            background: #1a1a2e;
            border: 2px solid rgba(159, 52, 250, 0.2);
        }

        .image-node img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .image-node:hover {
            transform: scale(1.2);
            box-shadow: 0 8px 40px rgba(241, 179, 58, 0.5);
            border-color: rgba(241, 179, 58, 0.6);
            z-index: 100;
        }

        .image-node:hover img {
            transform: scale(1.08);
        }

        .image-label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.95), transparent);
            padding: 25px 15px 15px 15px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .image-node:hover .image-label {
            opacity: 1;
            transform: translateY(0);
        }

        .image-label h3 {
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: #F1B33A;
        }

        .image-label p {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 300;
        }

        /* Controls */
        .controls {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: flex;
            gap: 12px;
            z-index: 1000;
        }

        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(76, 76, 241, 0.2);
            border: 2px solid rgba(159, 52, 250, 0.4);
            color: white;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            font-family: 'Poppins', sans-serif;
        }

        .control-btn:hover {
            background: #F1B33A;
            border-color: #F1B33A;
            color: #050508;
            transform: scale(1.1);
            box-shadow: 0 4px 20px rgba(241, 179, 58, 0.5);
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 30px 40px;
            background: linear-gradient(to bottom, 
                rgba(5, 5, 8, 0.95) 0%, 
                rgba(5, 5, 8, 0.7) 50%,
                transparent 100%);
            z-index: 1000;
            pointer-events: none;
        }

        .header h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #9F34FA 0%, #F1B33A 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.5));
        }

        .header p {
            font-size: 0.85rem;
            color: rgba(241, 179, 58, 0.9);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 400;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
        }
        
        .header .subtitle {
            font-size: 0.75rem;
            color: rgba(159, 52, 250, 0.7);
            letter-spacing: 1px;
            margin-top: 4px;
            font-weight: 300;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
        }

        .zoom-indicator {
            position: fixed;
            top: 30px;
            right: 40px;
            font-size: 0.85rem;
            color: rgba(241, 179, 58, 0.9);
            font-weight: 500;
            letter-spacing: 1px;
            z-index: 1000;
            pointer-events: none;
            font-family: 'Poppins', sans-serif;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
            background: rgba(5, 5, 8, 0.6);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(159, 52, 250, 0.3);
            backdrop-filter: blur(10px);
        }

        /* Lightbox */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            opacity: 0;
            transition: opacity 0.4s ease;
            backdrop-filter: blur(20px);
        }

        .lightbox.active {
            display: flex;
            animation: fadeIn 0.4s ease forwards;
        }

        .lightbox-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            animation: zoomIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .lightbox-content img {
            max-width: 100%;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 20px 80px rgba(159, 52, 250, 0.4);
            border: 3px solid rgba(159, 52, 250, 0.3);
        }

        .lightbox-info {
            position: absolute;
            bottom: -60px;
            left: 0;
            right: 0;
            text-align: center;
        }

        .lightbox-info h2 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            margin-bottom: 6px;
            color: #F1B33A;
        }

        .lightbox-info p {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .lightbox-close {
            position: absolute;
            top: -60px;
            right: 0;
            background: rgba(76, 76, 241, 0.2);
            border: 2px solid rgba(159, 52, 250, 0.4);
            color: white;
            font-size: 32px;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-weight: 300;
            line-height: 1;
        }

        .lightbox-close:hover {
            background: #F1B33A;
            border-color: #F1B33A;
            color: #050508;
            transform: rotate(90deg);
            box-shadow: 0 4px 20px rgba(241, 179, 58, 0.5);
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(76, 76, 241, 0.2);
            border: 2px solid rgba(159, 52, 250, 0.4);
            color: white;
            font-size: 32px;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .lightbox-nav:hover {
            background: #F1B33A;
            border-color: #F1B33A;
            color: #050508;
            transform: translateY(-50%) scale(1.1);
            box-shadow: 0 4px 20px rgba(241, 179, 58, 0.5);
        }

        .lightbox-prev { left: 30px; }
        .lightbox-next { right: 30px; }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes zoomIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (max-width: 768px) {
            .header h1 { font-size: 1.8rem; }
            .controls { bottom: 20px; right: 20px; }
            .lightbox-nav {
                width: 50px;
                height: 50px;
                font-size: 24px;
            }
            .lightbox-prev { left: 15px; }
            .lightbox-next { right: 15px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>MIC 2025 Gallery</h1>
        <p>Sydney • October 31 - November 2</p>
        <div class="subtitle">Mouse or Drag to Navigate • Scroll to Zoom • Click to View</div>
    </div>

    <div class="zoom-indicator" id="zoomIndicator">ZOOM: 100%</div>

    <div class="viewport" id="viewport">
        <div class="canvas" id="canvas">
            <!-- Images will be generated by JavaScript -->
        </div>
    </div>

    <div class="controls">
        <button class="control-btn" id="zoomIn" title="Zoom In">+</button>
        <button class="control-btn" id="zoomOut" title="Zoom Out">−</button>
        <button class="control-btn" id="resetView" title="Reset View">⌂</button>
    </div>

    <div class="lightbox" id="lightbox">
        <div class="lightbox-content">
            <button class="lightbox-close" id="lightboxClose">×</button>
            <button class="lightbox-nav lightbox-prev" id="lightboxPrev">‹</button>
            <img src="" alt="Lightbox image" id="lightboxImg">
            <button class="lightbox-nav lightbox-next" id="lightboxNext">›</button>
            <div class="lightbox-info" id="lightboxInfo">
                <h2 id="lightboxTitle"></h2>
                <p id="lightboxDesc"></p>
            </div>
        </div>
    </div>

    <script>
        let allItems = [];

        const basePath = (() => {
            const path = window.location.pathname;
            if (path.endsWith('/')) return path;
            const idx = path.lastIndexOf('/');
            return idx === -1 ? '/' : path.slice(0, idx + 1);
        })();

        function resolveMediaPath(mediaPath) {
            if (!mediaPath) return '';
            if (/^https?:\/\//i.test(mediaPath)) return mediaPath;
            const cleanPath = mediaPath.replace(/^\/+/, '');
            return `${basePath}${cleanPath}`;
        }

        const viewport = document.getElementById('viewport');
        const canvas = document.getElementById('canvas');
        const zoomIndicator = document.getElementById('zoomIndicator');

        let scale = 1;
        
        // Image grid settings
        const imageWidth = 240;
        const imageHeight = 320;
        const gap = 20;
        const columns = 12;
        
        // Add padding to ensure edges are visible and header doesn't block
        const topPadding = 150; // Space for header
        const leftPadding = 40;
        const rightPadding = 40;
        const bottomPadding = 40;
        
        let canvasWidth = 0;
        let canvasHeight = 0;

        fetch("./gallery/gallery.json")
            .then(r => r.json())
            .then(items => {
                allItems = items;
                canvas.innerHTML = "";
                createLayout();
            })
            .catch(err => console.error("Failed to load gallery JSON", err));

        // Movement variables
        let targetX = 0;
        let targetY = 0;
        let currentX = 0;
        let currentY = 0;
        let velocityX = 0;
        let velocityY = 0;
        let isDragging = false;
        let hasUserDragged = false; // Track if user has ever dragged
        let dragStartX = 0;
        let dragStartY = 0;
        let dragLastX = 0;
        let dragLastY = 0;
        let lastMoveTime = Date.now();
        let lastDragX = 0;
        let lastDragY = 0;
        let dragDistance = 0;

        // Create uniform grid layout
        function createLayout() {
            if (!allItems.length) return;

            const totalItems = Math.max(allItems.length, 1);
            const rows = Math.ceil(totalItems / columns);

            canvasWidth = leftPadding + (columns * (imageWidth + gap)) + gap + rightPadding;
            canvasHeight = topPadding + (rows * (imageHeight + gap)) + gap + bottomPadding;

            // Set canvas dimensions explicitly
            canvas.style.width = `${canvasWidth}px`;
            canvas.style.height = `${canvasHeight}px`;
            
            allItems.forEach((item, index) => {
                const col = index % columns;
                const row = Math.floor(index / columns);
                
                const x = leftPadding + col * (imageWidth + gap) + gap;
                const y = topPadding + row * (imageHeight + gap) + gap;
                
                const node = document.createElement('div');
                node.className = 'image-node';
                node.style.left = `${x}px`;
                node.style.top = `${y}px`;
                node.style.width = `${imageWidth}px`;
                node.style.height = `${imageHeight}px`;
                const img = document.createElement('img');
                img.src = resolveMediaPath(item.thumb || item.full);
                img.alt = item.title || 'MIC 2025 Gallery image';

                const label = document.createElement('div');
                label.className = 'image-label';
                label.innerHTML = `
                    <h3>${item.category || item.title || 'MIC 2025'}</h3>
                    <p>${item.desc || ''}</p>
                `;
                
                node.appendChild(img);
                node.appendChild(label);
                canvas.appendChild(node);
                
                // Click to open lightbox (only if not dragging)
                node.addEventListener('mousedown', () => {
                    dragDistance = 0;
                });
                
                node.addEventListener('touchstart', () => {
                    touchDistance = 0;
                });
                
                node.addEventListener('click', (e) => {
                    // Only open if the click wasn't part of a drag
                    if (dragDistance < 5 && touchDistance < 10) {
                        e.stopPropagation();
                        openLightbox(index);
                    }
                });
            });
            
            // Initialize position at top-left corner for clearest initial view
            currentX = 0;
            currentY = 0;
            targetX = 0;
            targetY = 0;
        }

        // Mouse tracking for parallax effect (only when user hasn't dragged yet)
        document.addEventListener('mousemove', (e) => {
            if (lightbox.classList.contains('active') || isDragging || hasUserDragged) return;
            
            // Normalize mouse position to 0 to 1
            const mouseX = e.clientX / window.innerWidth;
            const mouseY = e.clientY / window.innerHeight;
            
            // Calculate movement range (how far we can pan)
            const minX = Math.min(0, window.innerWidth - canvasWidth * scale);
            const minY = Math.min(0, window.innerHeight - canvasHeight * scale);
            
            // Map mouse position to pan range (0 = top/left, 1 = bottom/right)
            targetX = mouseX * minX;
            targetY = mouseY * minY;
        });

        // Drag to pan
        viewport.addEventListener('mousedown', (e) => {
            if (e.target.closest('.image-node') || e.target.closest('.control-btn')) return;
            
            isDragging = true;
            dragDistance = 0;
            dragStartX = e.clientX;
            dragStartY = e.clientY;
            dragLastX = targetX;
            dragLastY = targetY;
            lastDragX = e.clientX;
            lastDragY = e.clientY;
            lastMoveTime = Date.now();
            velocityX = 0;
            velocityY = 0;
            viewport.style.cursor = 'grabbing';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            
            const currentTime = Date.now();
            const deltaTime = currentTime - lastMoveTime;
            
            if (deltaTime > 0) {
                const deltaX = e.clientX - dragStartX;
                const deltaY = e.clientY - dragStartY;
                
                // Track total drag distance
                dragDistance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
                
                // Only mark as user dragged if they moved more than 5px
                if (dragDistance > 5) {
                    hasUserDragged = true;
                }
                
                // Calculate velocity for momentum
                velocityX = (e.clientX - lastDragX) / deltaTime * 16;
                velocityY = (e.clientY - lastDragY) / deltaTime * 16;
                
                targetX = dragLastX + deltaX;
                targetY = dragLastY + deltaY;
                
                // Constrain to boundaries
                // maxX/maxY = 0 (top-left corner)
                // minX/minY = negative (bottom-right corner)
                const minX = Math.min(0, window.innerWidth - canvasWidth * scale);
                const minY = Math.min(0, window.innerHeight - canvasHeight * scale);
                
                targetX = Math.max(minX, Math.min(0, targetX));
                targetY = Math.max(minY, Math.min(0, targetY));
                
                lastDragX = e.clientX;
                lastDragY = e.clientY;
                lastMoveTime = currentTime;
            }
        });

        document.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                viewport.style.cursor = 'grab';
                
                // Apply momentum - velocity will decay in animation loop
            }
        });

        // Smooth animation loop
        function animate() {
            // Apply momentum if not actively dragging/touching
            if (!isDragging && !isTouching && hasUserDragged) {
                // Apply velocity
                targetX += velocityX;
                targetY += velocityY;
                
                // Decay velocity (friction)
                velocityX *= 0.92;
                velocityY *= 0.92;
                
                // Stop if velocity is very small
                if (Math.abs(velocityX) < 0.1) velocityX = 0;
                if (Math.abs(velocityY) < 0.1) velocityY = 0;
                
                // Constrain to boundaries
                const minX = Math.min(0, window.innerWidth - canvasWidth * scale);
                const minY = Math.min(0, window.innerHeight - canvasHeight * scale);
                
                if (targetX < minX || targetX > 0) {
                    targetX = Math.max(minX, Math.min(0, targetX));
                    velocityX = 0;
                }
                if (targetY < minY || targetY > 0) {
                    targetY = Math.max(minY, Math.min(0, targetY));
                    velocityY = 0;
                }
            }
            
            // Smooth interpolation (easing)
            const easing = (isDragging || isTouching) ? 0.25 : 0.12;
            currentX += (targetX - currentX) * easing;
            currentY += (targetY - currentY) * easing;
            
            // Apply transform
            canvas.style.transform = `translate(${currentX}px, ${currentY}px) scale(${scale})`;
            
            requestAnimationFrame(animate);
        }

        // Zoom functionality
        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            
            const delta = e.deltaY > 0 ? -0.1 : 0.1;
            const newScale = Math.max(0.5, Math.min(2, scale + delta));
            
            // Zoom toward mouse position
            const rect = viewport.getBoundingClientRect();
            const mouseX = e.clientX - rect.left - window.innerWidth / 2;
            const mouseY = e.clientY - rect.top - window.innerHeight / 2;
            
            const scaleDiff = newScale - scale;
            targetX -= mouseX * scaleDiff / scale;
            targetY -= mouseY * scaleDiff / scale;
            
            scale = newScale;
            
            // Constrain to new boundaries after zoom
            const minX = Math.min(0, window.innerWidth - canvasWidth * scale);
            const minY = Math.min(0, window.innerHeight - canvasHeight * scale);
            
            targetX = Math.max(minX, Math.min(0, targetX));
            targetY = Math.max(minY, Math.min(0, targetY));
            
            zoomIndicator.textContent = `ZOOM: ${Math.round(scale * 100)}%`;
        });

        // Control buttons
        document.getElementById('zoomIn').addEventListener('click', () => {
            scale = Math.min(2, scale + 0.2);
            
            // Constrain to new boundaries after zoom
            const minX = Math.min(0, window.innerWidth - canvasWidth * scale);
            const minY = Math.min(0, window.innerHeight - canvasHeight * scale);
            
            targetX = Math.max(minX, Math.min(0, targetX));
            targetY = Math.max(minY, Math.min(0, targetY));
            
            zoomIndicator.textContent = `ZOOM: ${Math.round(scale * 100)}%`;
        });

        document.getElementById('zoomOut').addEventListener('click', () => {
            scale = Math.max(0.5, scale - 0.2);
            
            // Constrain to new boundaries after zoom
            const minX = Math.min(0, window.innerWidth - canvasWidth * scale);
            const minY = Math.min(0, window.innerHeight - canvasHeight * scale);
            
            targetX = Math.max(minX, Math.min(0, targetX));
            targetY = Math.max(minY, Math.min(0, targetY));
            
            zoomIndicator.textContent = `ZOOM: ${Math.round(scale * 100)}%`;
        });

        document.getElementById('resetView').addEventListener('click', () => {
            scale = 1;
            targetX = 0;
            targetY = 0;
            velocityX = 0;
            velocityY = 0;
            hasUserDragged = false; // Re-enable mouse tracking
            zoomIndicator.textContent = `ZOOM: 100%`;
        });

        // Touch support for mobile
        let touchStartX = 0;
        let touchStartY = 0;
        let touchLastX = 0;
        let touchLastY = 0;
        let lastTouchX = 0;
        let lastTouchY = 0;
        let lastTouchTime = Date.now();
        let touchDistance = 0;
        let isTouching = false;

        viewport.addEventListener('touchstart', (e) => {
            if (e.target.closest('.image-node') || lightbox.classList.contains('active')) return;
            
            isTouching = true;
            touchDistance = 0;
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            touchLastX = targetX;
            touchLastY = targetY;
            lastTouchX = e.touches[0].clientX;
            lastTouchY = e.touches[0].clientY;
            lastTouchTime = Date.now();
            velocityX = 0;
            velocityY = 0;
        });

        viewport.addEventListener('touchmove', (e) => {
            if (!isTouching) return;
            e.preventDefault();
            
            const currentTime = Date.now();
            const deltaTime = currentTime - lastTouchTime;
            
            if (deltaTime > 0) {
                const deltaX = e.touches[0].clientX - touchStartX;
                const deltaY = e.touches[0].clientY - touchStartY;
                
                // Track total touch distance
                touchDistance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
                
                // Only mark as user dragged if they moved more than 10px
                if (touchDistance > 10) {
                    hasUserDragged = true;
                }
                
                // Calculate velocity for momentum
                velocityX = (e.touches[0].clientX - lastTouchX) / deltaTime * 16;
                velocityY = (e.touches[0].clientY - lastTouchY) / deltaTime * 16;
                
                targetX = touchLastX + deltaX;
                targetY = touchLastY + deltaY;
                
                // Constrain to boundaries
                const minX = Math.min(0, window.innerWidth - canvasWidth * scale);
                const minY = Math.min(0, window.innerHeight - canvasHeight * scale);
                
                targetX = Math.max(minX, Math.min(0, targetX));
                targetY = Math.max(minY, Math.min(0, targetY));
                
                lastTouchX = e.touches[0].clientX;
                lastTouchY = e.touches[0].clientY;
                lastTouchTime = currentTime;
            }
        });

        viewport.addEventListener('touchend', () => {
            isTouching = false;
            // Momentum will continue in animation loop
        });

        // Lightbox functionality
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const lightboxTitle = document.getElementById('lightboxTitle');
        const lightboxDesc = document.getElementById('lightboxDesc');
        const lightboxClose = document.getElementById('lightboxClose');
        const lightboxPrev = document.getElementById('lightboxPrev');
        const lightboxNext = document.getElementById('lightboxNext');

        let currentIndex = 0;

        function openLightbox(index) {
            if (!allItems.length) return;
            currentIndex = index;
            const item = allItems[currentIndex];
            if (!item) return;
            lightboxImg.src = resolveMediaPath(item.full || item.thumb);
            lightboxTitle.textContent = item.title || '';
            lightboxDesc.textContent = item.desc || '';
            lightbox.classList.add('active');
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
        }

        function showNext() {
            if (!allItems.length) return;
            currentIndex = (currentIndex + 1) % allItems.length;
            const item = allItems[currentIndex];
            lightboxImg.src = resolveMediaPath(item.full || item.thumb);
            lightboxTitle.textContent = item.title || '';
            lightboxDesc.textContent = item.desc || '';
        }

        function showPrev() {
            if (!allItems.length) return;
            currentIndex = (currentIndex - 1 + allItems.length) % allItems.length;
            const item = allItems[currentIndex];
            lightboxImg.src = resolveMediaPath(item.full || item.thumb);
            lightboxTitle.textContent = item.title || '';
            lightboxDesc.textContent = item.desc || '';
        }

        lightboxClose.addEventListener('click', closeLightbox);
        lightboxNext.addEventListener('click', showNext);
        lightboxPrev.addEventListener('click', showPrev);

        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
        });

        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowRight') showNext();
            if (e.key === 'ArrowLeft') showPrev();
        });

        // Initialize
        animate(); // Start animation loop
    </script>
</body>
</html>
